name: Android Launcher Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Download Gradle 6.7.1
        run: |
          curl -L --fail --retry 3 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-6.7.1-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-6.7.1/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ts10-launcher-debug
          path: app/build/outputs/apk/debug/*.apk
